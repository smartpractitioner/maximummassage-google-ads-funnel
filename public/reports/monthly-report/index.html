<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<meta name="robots" content="noindex, nofollow" />
<title>Monthly Report · Maximum Massage Therapy</title>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;600;700&family=DM+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
<script data-cfasync="false" src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
<script data-cfasync="false" src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
<script data-cfasync="false" src="https://cdnjs.cloudflare.com/ajax/libs/prop-types/15.8.1/prop-types.min.js"></script>
<script data-cfasync="false" src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.2/babel.min.js"></script>
<script data-cfasync="false" src="https://cdnjs.cloudflare.com/ajax/libs/recharts/2.8.0/Recharts.min.js"></script>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: #F7F4EF; font-family: 'DM Sans', sans-serif; }
  button { cursor: pointer; border: none; outline: none; font-family: inherit; }
  table { border-collapse: collapse; width: 100%; }
  th, td { text-align: left; padding: 8px 10px; font-size: 14px; }

  .rail {
    position: fixed; left: 0; top: 0; bottom: 0; width: 240px;
    padding: 28px 16px 24px 20px; background: transparent;
    overflow-y: auto; z-index: 20;
  }
  .rail-inner {
    background: rgba(255, 255, 255, 0.55); backdrop-filter: blur(8px);
    border: 1px solid #E8E1D6; border-radius: 14px;
    padding: 22px 18px; box-shadow: 0 4px 24px rgba(45, 82, 66, 0.08);
  }
  .rail-brand {
    font-family: 'Cormorant Garamond', serif; font-size: 22px; font-weight: 700;
    color: #1A1A1A; line-height: 1.15; margin-bottom: 4px;
  }
  .rail-brand-sub {
    font-size: 12px; letter-spacing: 0.12em; text-transform: uppercase;
    color: #B8913F; font-weight: 700; margin-bottom: 26px;
  }
  .rail-section { margin-bottom: 22px; }
  .rail-label {
    font-size: 12px; font-weight: 700; letter-spacing: 0.12em;
    text-transform: uppercase; color: #B8913F; margin-bottom: 10px;
  }
  .rail-btn {
    display: block; width: 100%; text-align: left; padding: 7px 12px;
    border-radius: 18px; font-size: 14px; font-weight: 600;
    margin-bottom: 3px; background: transparent; color: #6B6459;
    transition: all 0.12s;
  }
  .rail-btn:hover { background: #F7F4EF; color: #1A1A1A; }
  .rail-btn-active { background: #2D5242; color: #FFFFFF; }
  .rail-btn-active:hover { background: #2D5242; color: #FFFFFF; }
  .rail-window {
    display: flex; align-items: center; gap: 8px; margin-top: 4px;
  }
  .rail-window-label { font-size: 13px; color: #1A1A1A; font-weight: 600; flex: 1; text-align: center; }
  .rail-prior { font-size: 12px; color: #6B6459; margin-top: 6px; line-height: 1.4; }

  .report-content { margin-left: 240px; padding: 40px 28px; }
  .report-content-inner { max-width: 920px; margin: 0 auto; }

  .date-input {
    display: block; width: 100%; padding: 7px 10px; margin-bottom: 8px;
    border-radius: 8px; border: 1px solid #E8E1D6; background: #FFFFFF;
    font-family: inherit; font-size: 14px; color: #1A1A1A; cursor: pointer;
  }
  .date-input:focus { outline: none; border-color: #2D5242; }
  .date-label { font-size: 12px; font-weight: 600; color: #6B6459; margin-bottom: 3px; }

  .pill-row { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 14px; }
  .pill {
    padding: 5px 11px; border-radius: 16px; font-size: 13px; font-weight: 600;
    border: 1px solid transparent; background: #EDE9E3; color: #6B6459;
    transition: all 0.12s;
  }
  .pill:hover { background: #E0DACE; color: #1A1A1A; }
  .pill-active { background: #2D5242; color: #FFFFFF; border-color: #2D5242; }
  .pill-active:hover { background: #2D5242; color: #FFFFFF; }

  .chart-title { font-size: 40px; font-weight: 700; color: #1A1A1A; font-family: 'Cormorant Garamond', serif; line-height: 1.1; }
  .chart-subtitle { font-size: 14px; color: #6B6459; margin-top: 6px; line-height: 1.5; }

  @media (max-width: 900px) {
    .rail {
      position: static; width: auto; height: auto;
      padding: 12px 16px; overflow-y: visible;
    }
    .rail-inner { padding: 14px 16px; }
    .rail-brand { display: inline-block; margin-right: 16px; }
    .rail-brand-sub { display: inline-block; margin-bottom: 10px; }
    .rail-section { margin-bottom: 14px; }
    .rail-btn { display: inline-block; width: auto; margin-right: 4px; }
    .report-content { margin-left: 0; padding: 20px 16px; }
  }
</style>
</head>
<body>
<div id="root"></div>

<script type="text/babel" data-cfasync="false">
const { useState, useEffect, useMemo } = React;
const {
  BarChart, Bar, LineChart, Line, XAxis, YAxis, CartesianGrid, Tooltip,
  Legend, ResponsiveContainer, LabelList
} = Recharts;

const C = {
  bg: "#F7F4EF", card: "#FFFFFF",
  green: "#2D5242", greenLight: "#3D6B56", greenPale: "#EAF0EC",
  gold: "#B8913F", goldLight: "#F0E4C6",
  empty: "#D9CFC3", text: "#1A1A1A", muted: "#6B6459",
  accent: "#C4653A", cancelled: "#C4653A",
};

const MONTH_LABELS = ["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];
const SNAPSHOT_LABELS = { "1mo": "Last month", "4mo": "Last 4 months", "12mo": "Last 12 months" };
const monthLabel = (ym) => {
  const [y, m] = ym.split("-").map(Number);
  return `${MONTH_LABELS[m-1]} '${String(y).slice(2)}`;
};
const shiftYear = (ym, delta) => {
  const [y, m] = ym.split("-").map(Number);
  return `${y + delta}-${String(m).padStart(2, "0")}`;
};
const fmtMoney = (v) => {
  if (v == null) return "—";
  if (Math.abs(v) >= 1000) return `$${(v/1000).toFixed(1)}k`;
  return `$${v}`;
};
const fmtNum = (v) => v == null ? "—" : v.toLocaleString();
const pct = (cur, prior) => {
  if (prior == null || prior === 0) return null;
  return ((cur - prior) / prior) * 100;
};

// --- Focus-4 & Ad Funnel snapshot (static analysis, refreshed manually — not part of the
// monthly data.json pipeline yet). Built 2026-09-19 from the monthly-report source data
// (per-therapist daily rows + an Apr-vs-Aug availability snapshot comparison) plus the ad
// funnel's own sheets (MH - Leads + Bookings.xlsx, MH - Quiz Data.xlsx). Re-run the same
// analysis and edit this object to refresh; see the write-up below for method notes. ---
const FOCUS4_DATA = {
  asOf: "September 19, 2026",
  monthly: {
    months: ["2025-10","2025-11","2025-12","2026-01","2026-02","2026-03","2026-04","2026-05","2026-06","2026-07","2026-08"],
    "Brookelyn Brolly": { completed:[27,20,22,22,24,24,22,20,17,18,13], revenue:[3841,2705,3060,3017,3548,3320,2864,2702,2474,2637,1823] },
    "Charlotte Tooth":  { completed:[6,11,8,6,10,7,8,6,11,8,9],       revenue:[911,1465,977,846,1432,814,1107,846,1497,1074,1204] },
    "Lindsey Stauffer": { completed:[21,19,27,16,16,16,12,19,21,13,17], revenue:[2799,2344,3646,2311,2083,2246,1693,2474,2734,1660,2200] },
    "Meagan Brown":     { completed:[9,5,9,9,7,4,8,4,6,4,7],         revenue:[1116,620,1302,1302,899,620,1054,558,868,558,1054] },
    everyoneElse:       { completed:[285,283,270,289,271,323,317,311,342,261,302], revenue:[37186,35417,33306,37032,34287,38445,39727,39987,42904,33408,36996] },
    wholeClinic:        { completed:[348,338,336,342,328,374,367,360,397,304,348], revenue:[45854,42551,42290,44508,42250,45445,46445,46566,50477,39337,43277] },
  },
  // Single-month schedule-utilization snapshot compared Apr'26 (first pull this project did) vs Aug'26 (latest).
  utilization: {
    "Brookelyn Brolly": { aprShift:85.92, aprAppt:33.33, aprPct:39, augShift:55.25, augAppt:16.17, augPct:29 },
    "Charlotte Tooth":  { aprShift:52.5,  aprAppt:11.75, aprPct:22, augShift:60,    augAppt:11.5,  augPct:19 },
    "Lindsey Stauffer": { aprShift:28.33, aprAppt:17,    aprPct:60, augShift:55.17, augAppt:22.67, augPct:41 },
    "Meagan Brown":     { aprShift:17.5,  aprAppt:12.25, aprPct:70, augShift:15,    augAppt:10.25, augPct:68 },
  },
  // Ad-funnel bookings (Cal.com, from the go.maximummassage.ca quiz/skill pages) by therapist, since each skill page went live.
  adFunnelBookingsByTherapist: { "Lindsey": 12, "Charlotte": 12, "Brookelyn": 6, "Meagan": 0 },
  funnelBySkill: [
    { skill:"Prenatal",    quiz:56,  bookings:18, leads:3, live:"since Jul 16" },
    { skill:"Deep tissue", quiz:48,  bookings:7,  leads:3, live:"since Aug 5" },
    { skill:"Lymphatic",   quiz:85,  bookings:3,  leads:8, live:"since Aug 4" },
    { skill:"Therapeutic", quiz:117, bookings:2,  leads:4, live:"since Aug 6" },
  ],
  funnelTotals: { quiz:306, bookings:30, leads:19, matchedRecommendation:21, pctPaidGclid:83 },
};

// --- KPI card with YoY delta ---
const KPI = ({ label, value, delta, accent, hint }) => {
  const isUp = delta != null && delta >= 0;
  const deltaColor = delta == null ? C.muted : (isUp ? C.green : C.accent);
  return (
    <div style={{ background:C.card, borderRadius:14, padding:"22px 18px", flex:1, minWidth:160, boxShadow:"0 2px 12px rgba(0,0,0,0.06)", border:"1px solid rgba(0,0,0,0.06)", borderTop:`3px solid ${accent||C.green}` }}>
      <div style={{ fontSize:13, fontWeight:700, color:C.text, letterSpacing:"0.06em", textTransform:"uppercase", marginBottom:10 }}>{label}</div>
      <div style={{ fontFamily:"'Cormorant Garamond',serif", fontSize:34, fontWeight:700, color:accent||C.green, lineHeight:1, marginBottom:8 }}>{value}</div>
      <div style={{ fontSize:14, color:deltaColor, fontWeight:600 }}>
        {delta == null ? "No prior-period data" : `${isUp ? "▲" : "▼"} ${Math.abs(delta).toFixed(1)}% vs. prior period`}
      </div>
      {hint && <div style={{ fontSize:13, color:C.muted, marginTop:6, lineHeight:1.5 }}>{hint}</div>}
    </div>
  );
};

// --- Section-1 KPI (capacity-report visual idiom: big serif number, pastel bg, optional accent border) ---
const SectionKPI = ({ label, value, sub, color, accent }) => (
  <div style={{
    background: color || C.card, borderRadius: 14, padding: "22px 18px",
    flex: 1, minWidth: 140, boxShadow: "0 2px 12px rgba(0,0,0,0.06)",
    border: "1px solid rgba(0,0,0,0.06)",
    borderTop: accent ? `3px solid ${accent}` : undefined,
  }}>
    <div style={{ fontFamily:"'Cormorant Garamond',serif", fontSize:36, fontWeight:700, color:accent||C.green, lineHeight:1, marginBottom:6 }}>{value}</div>
    <div style={{ fontSize:14, fontWeight:700, color:C.text, letterSpacing:"0.04em", textTransform:"uppercase", marginBottom: sub?4:0 }}>{label}</div>
    {sub && <div style={{ fontSize:13, color:C.muted, lineHeight:1.5 }}>{sub}</div>}
  </div>
);

const Step = ({ n, children }) => (
  <div style={{ display:"flex", alignItems:"center", gap:12, marginBottom:16 }}>
    <div style={{ width:28, height:28, borderRadius:"50%", background:C.green, color:"#fff", fontSize:15, fontWeight:700, display:"flex", alignItems:"center", justifyContent:"center", flexShrink:0 }}>{n}</div>
    <h2 style={{ fontFamily:"'Cormorant Garamond',serif", fontSize:44, fontWeight:700, color:C.text, margin:0 }}>{children}</h2>
  </div>
);

// --- Stacked bar tooltip (monthly: completed + cancelled) ---
const StackTooltip = ({ active, payload, label }) => {
  if (!active || !payload?.length) return null;
  const get = k => payload.find(p => p.dataKey === k)?.value ?? 0;
  return (
    <div style={{ background:C.green, color:"#fff", borderRadius:10, padding:"12px 16px", fontSize:14, boxShadow:"0 4px 20px rgba(0,0,0,0.25)", minWidth:180 }}>
      <div style={{ fontWeight:700, marginBottom:8 }}>{label}</div>
      {[["completed","#a8d4bc","✓ Completed"],["cancelled","#e8b499","✗ Cancelled"]].map(([k,col,lbl]) => (
        <div key={k} style={{ display:"flex", justifyContent:"space-between", gap:16, marginBottom:3 }}>
          <span style={{ color:col }}>{lbl}</span>
          <span style={{ fontWeight:700 }}>{fmtNum(get(k))}</span>
        </div>
      ))}
    </div>
  );
};

// --- Utilization bucket tooltip (per-therapist: completed% + cancelled% + idle% + raw hours) ---
const UtilTooltip = ({ active, payload }) => {
  if (!active || !payload?.length) return null;
  const p = payload[0]?.payload;
  if (!p) return null;
  return (
    <div style={{ background:C.green, color:"#fff", borderRadius:10, padding:"12px 16px", fontSize:14, boxShadow:"0 4px 20px rgba(0,0,0,0.25)", minWidth:220 }}>
      <div style={{ fontWeight:700, marginBottom:8 }}>{p.fullName || p.name}</div>
      <div style={{ display:"flex", justifyContent:"space-between", gap:16, marginBottom:3 }}>
        <span style={{ color:"#a8d4bc" }}>✓ Completed</span>
        <span style={{ fontWeight:700 }}>{p.completedPct}% · {p.completedHours?.toFixed(0)}h</span>
      </div>
      <div style={{ display:"flex", justifyContent:"space-between", gap:16, marginBottom:3 }}>
        <span style={{ color:"#e8b499" }}>✗ Cancelled</span>
        <span style={{ fontWeight:700 }}>{p.cancelledPct}% · {p.cancelledHours?.toFixed(0)}h</span>
      </div>
      <div style={{ display:"flex", justifyContent:"space-between", gap:16, marginBottom:3 }}>
        <span style={{ color:"#c8bfb5" }}>○ Idle</span>
        <span style={{ fontWeight:700 }}>{p.idlePct}% · {p.idleHours?.toFixed(0)}h</span>
      </div>
      <div style={{ fontSize:13, color:"#c8bfb5", marginTop:6, paddingTop:6, borderTop:"1px solid rgba(255,255,255,0.15)" }}>
        {p.shiftHours?.toFixed(0)}h scheduled capacity
      </div>
    </div>
  );
};

// --- Line tooltip (current vs prior year) ---
const LineTooltip = ({ active, payload, label, formatter }) => {
  if (!active || !payload?.length) return null;
  return (
    <div style={{ background:C.green, color:"#fff", borderRadius:10, padding:"10px 14px", fontSize:14, boxShadow:"0 4px 20px rgba(0,0,0,0.2)" }}>
      <div style={{ fontWeight:700, marginBottom:6 }}>{label}</div>
      {payload.map((p,i) => (
        <div key={i} style={{ display:"flex", justifyContent:"space-between", gap:14, marginBottom:2 }}>
          <span style={{ color:p.color, fontWeight:600 }}>{p.name}</span>
          <span>{formatter ? formatter(p.value) : p.value}</span>
        </div>
      ))}
    </div>
  );
};

// --- Main app ---
function App() {
  const [data, setData] = useState(null);
  const [error, setError] = useState(null);
  const [view, setView] = useState("dashboard"); // "dashboard" | "focus4"
  const [segmentKey, setSegmentKey] = useState(null);
  const [dateStart, setDateStart] = useState(null); // YYYY-MM-DD
  const [dateEnd, setDateEnd]     = useState(null); // YYYY-MM-DD
  const [activePreset, setActivePreset] = useState(null); // "7d" | "30d" | "thismo" | "lastmo" | "12mo" | "lastyr" | null
  const [activePractitioners, setActivePractitioners] = useState(null); // Set<string> of practitioners in util chart

  useEffect(() => {
    fetch("./data.json", { cache: "no-store" })
      .then(r => { if (!r.ok) throw new Error(`HTTP ${r.status}`); return r.json(); })
      .then(d => {
        setData(d);
        const firstSeg = Object.keys(d.segments || {})[0];
        if (firstSeg) setSegmentKey(firstSeg);
        // Default date window: last 6 months ending on the latest data date.
        if (d.lastDataDate) {
          const end = d.lastDataDate;
          const [y, m] = end.split("-").map(Number);
          let sy = y, sm = m - 5;
          while (sm < 1) { sm += 12; sy -= 1; }
          const start = `${sy}-${String(sm).padStart(2,"0")}-01`;
          setDateStart(start);
          setDateEnd(end);
        } else if (d.dataThrough) {
          const end = `${d.dataThrough}-28`;
          setDateEnd(end);
          setDateStart(`${shiftYear(d.dataThrough, 0).split("-")[0]}-01-01`);
        }
        // Utilization chart: default to focus practitioners selected.
        const focus = d.practitioners?.focus || [];
        setActivePractitioners(new Set(focus));
      })
      .catch(e => setError(e.message));
  }, []);

  if (error) return <EmptyState message={`Could not load data.json (${error}). Run the monthly ingestion script to generate it.`} />;
  if (!data) return <LoadingState />;
  if (!data.segments || Object.keys(data.segments).length === 0) return <EmptyState message="No segments in data.json. Check the ingestion script output." />;

  const segment = data.segments[segmentKey];
  if (!segment) return <LoadingState />;

  // Filter daily data to picked date range, roll up to monthly for charts/tables
  const { windowMonths, priorMonths, windowRows, priorRows } = buildRange(segment.daily, dateStart, dateEnd);

  // KPI deltas compare to the *prior period* (same length, immediately preceding).
  // The line charts and YoY tables further down still use prior-year (priorRows).
  const sum = (rows, k) => rows.reduce((s, r) => s + (r?.[k] || 0), 0);
  const sumDaily = (days, k) => days.reduce((s, r) => s + (r?.[k] || 0), 0);
  const periodLen = daysBetweenInclusive(dateStart, dateEnd);
  const priorPeriodEnd   = addDays(dateStart, -1);
  const priorPeriodStart = addDays(priorPeriodEnd, -(periodLen - 1));
  const priorPeriodDaily = (segment.daily || []).filter(d => d.date >= priorPeriodStart && d.date <= priorPeriodEnd);
  const hasPriorPeriod = priorPeriodDaily.length > 0;
  const kpis = {
    revenue:   { cur: sum(windowRows, "revenue"),    prior: hasPriorPeriod ? sumDaily(priorPeriodDaily, "revenue")   : null },
    completed: { cur: sum(windowRows, "completed"),  prior: hasPriorPeriod ? sumDaily(priorPeriodDaily, "completed") : null },
    cancelled: { cur: sum(windowRows, "cancelled"),  prior: hasPriorPeriod ? sumDaily(priorPeriodDaily, "cancelled") : null },
  };
  const booked = sum(windowRows, "booked");
  const cancRate = booked > 0 ? (kpis.cancelled.cur / booked) * 100 : null;

  // Chart data: one row per month in window, with current + prior values
  const stackChart = windowMonths.map((m, i) => ({
    name: monthLabel(m),
    completed: windowRows[i]?.completed || 0,
    cancelled: windowRows[i]?.cancelled || 0,
  }));

  // --- Schedule Utilization bucket chart (3-layer: completed + cancelled + idle) ---
  // Uses `practitionerUtilization` at the data root (all detected practitioners) and a
  // pill selector to toggle bars in/out. Defaults to focus practitioners.
  // The shift/appt/idle hours come from pre-bucketed availability snapshots (1mo/4mo/12mo
  // only — no daily granularity), so we pick whichever snapshot length is closest to the
  // rail's selected window.
  const allPractitioners = Object.keys(data.practitionerUtilization || {}).sort();
  const activeSet = activePractitioners || new Set(data.practitioners?.focus || []);

  const utilSnapshotKey = (() => {
    if (!dateStart || !dateEnd) return "12mo";
    const days = daysBetweenInclusive(dateStart, dateEnd);
    const choices = [["1mo", 30], ["4mo", 122], ["12mo", 365]];
    let best = choices[0][0], bestDiff = Math.abs(days - choices[0][1]);
    for (const [k, d] of choices) {
      const diff = Math.abs(days - d);
      if (diff < bestDiff) { best = k; bestDiff = diff; }
    }
    return best;
  })();
  const utilSnapshotRange = data.snapshotRanges?.[utilSnapshotKey];

  const utilChartData = allPractitioners.filter(n => activeSet.has(n)).map(name => {
    const snap = data.practitionerUtilization?.[name]?.[utilSnapshotKey];
    if (!snap || !snap.shiftHours) return null;
    const completedPct = Math.round((snap.completedHours / snap.shiftHours) * 100);
    const cancelledPct = Math.round((snap.cancelledHours / snap.shiftHours) * 100);
    const idlePct = Math.max(0, 100 - completedPct - cancelledPct);
    return {
      name: name.split(" ")[0],
      fullName: name,
      completedPct,
      cancelledPct,
      idlePct,
      shiftHours: snap.shiftHours,
      completedHours: snap.completedHours,
      cancelledHours: snap.cancelledHours,
      idleHours: snap.idleHours,
    };
  }).filter(Boolean);

  // --- Section 1: "real cost of empty hours" — segment-driven, 12mo snapshot ---
  // Fill rate = completedHours / shiftHours so the percentage matches the green
  // "Completed" segment in the Schedule Utilization chart above. Empty% = cancelled +
  // idle, so the two sum to 100 and the lost-revenue math (which counts cancelled
  // hours as lost) lines up with the % shown.
  const LIST_RATE = 124;
  const massage12 = data.segments?.["all-massage"]?.snapshot?.["12mo"];
  const blendedRate = (() => {
    if (!massage12 || !massage12.apptHours) return null;
    const range = data.snapshotRanges?.["12mo"];
    const days = (data.segments["all-massage"].daily || []).filter(d =>
      range ? d.date >= range.start && d.date <= range.end : true
    );
    const rev = days.reduce((s, d) => s + (d.revenue || 0), 0);
    return rev > 0 ? rev / massage12.apptHours : null;
  })();
  const avgRate = LIST_RATE;

  // Pull the 12mo snapshot for the currently selected segment.
  const isAggregateSegment = segmentKey === "whole-clinic" || segmentKey === "all-massage" || segmentKey === "focus-massage";
  const segmentSnap = isAggregateSegment
    ? data.segments?.[segmentKey]?.snapshot?.["12mo"]
    : (data.segments?.[segmentKey]?.snapshot?.["12mo"] || data.practitionerUtilization?.[segmentKey]?.["12mo"]);

  const section1 = segmentSnap && segmentSnap.shiftHours ? {
    lostRevPerMonth: Math.round(((segmentSnap.idleHours + segmentSnap.cancelledHours) * avgRate) / 12),
    emptyHoursPerMonth: Math.round((segmentSnap.idleHours + segmentSnap.cancelledHours) / 12),
    fillRate: segmentSnap.completedHours / segmentSnap.shiftHours,   // completed/shift (matches Schedule Utilization chart)
    avgRate: Math.round(avgRate),
    segLabel: segment.label || segmentKey,
    windowStart: segmentSnap.windowStart,
    windowEnd: segmentSnap.windowEnd,
  } : null;

  // For aggregate views (whole-clinic, all-massage), also compute the weakest focus
  // therapist so the third card can flag where the biggest upside sits.
  let lowestFillRate = null;
  if (isAggregateSegment) {
    for (const name of (data.practitioners?.focus || [])) {
      const snap = data.practitionerUtilization?.[name]?.["12mo"];
      if (!snap || !snap.shiftHours) continue;
      const rate = snap.completedHours / snap.shiftHours;
      if (lowestFillRate == null || rate < lowestFillRate.rate) {
        lowestFillRate = { name, rate, firstName: name.split(" ")[0] };
      }
    }
  }

  // YoY line charts (revenue, bookings, cancellations) — current solid, prior dashed gold
  const revChart = windowMonths.map((m, i) => ({
    name: monthLabel(m),
    current: windowRows[i]?.revenue || 0,
    prior:   priorRows[i]?.revenue ?? null,
  }));
  const bkChart = windowMonths.map((m, i) => ({
    name: monthLabel(m),
    current: windowRows[i]?.completed || 0,
    prior:   priorRows[i]?.completed ?? null,
  }));
  const cancChart = windowMonths.map((m, i) => ({
    name: monthLabel(m),
    current: windowRows[i]?.cancelled || 0,
    prior:   priorRows[i]?.cancelled ?? null,
  }));

  const togglePractitioner = (name) => {
    const next = new Set(activeSet);
    if (next.has(name)) next.delete(name); else next.add(name);
    setActivePractitioners(next);
  };

  // Date inputs are bounded by the full range of available daily data.
  const allDates = (segment.daily || []).map(d => d.date);
  const minDate = allDates[0];
  const maxDate = allDates[allDates.length - 1];

  // Preset windows. All anchored to maxDate (last day of available data) and
  // clamped so we never request outside the dataset.
  const applyPreset = (key) => {
    if (!minDate || !maxDate) return;
    const clamp = (d) => d < minDate ? minDate : (d > maxDate ? maxDate : d);
    let s, e;
    switch (key) {
      case "7d":     e = maxDate; s = addDays(maxDate, -6);  break;
      case "30d":    e = maxDate; s = addDays(maxDate, -29); break;
      case "60d":    e = maxDate; s = addDays(maxDate, -59); break;
      case "90d":    e = maxDate; s = addDays(maxDate, -89); break;
      case "thismo": e = maxDate; s = firstOfMonth(maxDate); break;
      case "lastmo": {
        const lmFirst = shiftMonthFirst(maxDate, -1);
        s = lmFirst; e = lastOfMonth(lmFirst);
        break;
      }
      case "thisqtr": {
        const [y, m] = maxDate.split("-").map(Number);
        const qStartMonth = Math.floor((m - 1) / 3) * 3 + 1;
        s = `${y}-${String(qStartMonth).padStart(2,"0")}-01`;
        e = maxDate;
        break;
      }
      case "lastqtr": {
        const [y, m] = maxDate.split("-").map(Number);
        const qStartMonth = Math.floor((m - 1) / 3) * 3 + 1;
        const thisQStart = `${y}-${String(qStartMonth).padStart(2,"0")}-01`;
        s = shiftMonthFirst(thisQStart, -3);
        e = lastOfMonth(shiftMonthFirst(thisQStart, -1));
        break;
      }
      case "lastyr": {
        const y = parseInt(maxDate.slice(0, 4), 10) - 1;
        s = `${y}-01-01`; e = `${y}-12-31`;
        break;
      }
      case "12mo": e = maxDate; s = addDays(shiftDateYear(maxDate, -1), 1); break;
      default: return;
    }
    setDateStart(clamp(s));
    setDateEnd(clamp(e));
    setActivePreset(key);
  };

  return (
    <div style={{ background:C.bg, minHeight:"100vh" }}>

      {/* LEFT RAIL — floating card: segment selector + date range picker */}
      <nav className="rail">
        <div className="rail-inner">
          <a href="../" style={{ display:"inline-flex", alignItems:"center", gap:6, fontSize:11, fontWeight:600, color:"#6B6459", textDecoration:"none", marginBottom:14, letterSpacing:"0.04em", textTransform:"uppercase" }}>← All reports</a>
          <div className="rail-brand">Monthly Report</div>
          <div className="rail-brand-sub">Maximum Massage</div>

          <div className="rail-section">
            <div className="rail-label">Report</div>
            <button
              onClick={() => setView("dashboard")}
              className={`rail-btn${view==="dashboard" ? " rail-btn-active" : ""}`}
            >Dashboard</button>
            <button
              onClick={() => setView("focus4")}
              className={`rail-btn${view==="focus4" ? " rail-btn-active" : ""}`}
            >Focus-4 &amp; Ad Funnel</button>
          </div>

          {view === "dashboard" && (
          <>
          <div className="rail-section">
            <div className="rail-label">View</div>
            {Object.entries(data.segments).map(([k, s]) => (
              <button
                key={k}
                onClick={() => setSegmentKey(k)}
                className={`rail-btn${segmentKey===k ? " rail-btn-active" : ""}`}
              >
                {s.label || k}
              </button>
            ))}
          </div>

          <div className="rail-section">
            <div className="rail-label">Date range</div>
            <div className="pill-row">
              {[
                ["7d", "Last 7 days"], ["30d", "Last 30 days"],
                ["60d", "Last 60 days"], ["90d", "Last 90 days"],
                ["thismo", "This month"], ["lastmo", "Last month"],
                ["thisqtr", "This quarter"], ["lastqtr", "Last quarter"],
                ["12mo", "Last 12 months"], ["lastyr", "Last year"],
              ].map(([k, label]) => (
                <button
                  key={k}
                  className={`pill${activePreset === k ? " pill-active" : ""}`}
                  onClick={() => applyPreset(k)}
                >{label}</button>
              ))}
            </div>
            <div className="date-label">Start</div>
            <input
              type="date"
              className="date-input"
              value={dateStart || ""}
              min={minDate}
              max={dateEnd || maxDate}
              onChange={e => { setDateStart(e.target.value); setActivePreset(null); }}
            />
            <div className="date-label">End</div>
            <input
              type="date"
              className="date-input"
              value={dateEnd || ""}
              min={dateStart || minDate}
              max={maxDate}
              onChange={e => { setDateEnd(e.target.value); setActivePreset(null); }}
            />
            <div className="rail-prior">
              Current: {fmtDate(dateStart)} – {fmtDate(dateEnd)}<br/>
              vs. {dateStart && dateEnd ? `${fmtDate(addDays(dateStart, -daysBetweenInclusive(dateStart, dateEnd)))} – ${fmtDate(addDays(dateStart, -1))}` : "no prior-period data"}
            </div>
          </div>
          </>)}
        </div>
      </nav>

      <main className="report-content">
        <div className="report-content-inner">

        {view === "focus4" ? (
        <Focus4Tab />
        ) : (
        <>
        {/* HEADER */}
        <div style={{ marginBottom:28, borderLeft:`4px solid ${C.green}`, paddingLeft:20 }}>
          <div style={{ fontSize:13, fontWeight:700, letterSpacing:"0.12em", textTransform:"uppercase", color:C.gold, marginBottom:10 }}>Monthly Report</div>
          <h1 style={{ fontFamily:"'Cormorant Garamond',serif", fontSize:38, fontWeight:700, color:C.text, lineHeight:1.2, margin:"0 0 12px" }}>
            Revenue, Bookings & Cancellations
          </h1>
          <p style={{ fontSize:15, color:C.muted, maxWidth:560, lineHeight:1.7, margin:0 }}>
            Data through <strong style={{ color:C.text }}>{data.dataThrough ? monthLabel(data.dataThrough) : "—"}</strong>
            {data.updatedAt && <> · Updated {new Date(data.updatedAt).toLocaleDateString()}</>}
          </p>
        </div>

        {/* KPI ROW — reflects selected date range */}
        <div style={{ display:"flex", gap:12, flexWrap:"wrap", marginBottom:28 }}>
          <KPI label="Revenue"        value={fmtMoney(kpis.revenue.cur)}   delta={pct(kpis.revenue.cur,   kpis.revenue.prior)}   accent={C.green} hint={`${fmtDate(dateStart)} – ${fmtDate(dateEnd)}`} />
          <KPI label="Bookings"       value={fmtNum(kpis.completed.cur)}   delta={pct(kpis.completed.cur, kpis.completed.prior)} accent={C.greenLight} hint="Completed = booked − cancelled" />
          <KPI label="Cancellations"  value={fmtNum(kpis.cancelled.cur)}   delta={pct(kpis.cancelled.cur, kpis.cancelled.prior)} accent={C.accent}     hint={cancRate != null ? `${cancRate.toFixed(1)}% cancellation rate` : null} />
        </div>

        {/* STACKED BAR: monthly bookings (completed + cancelled) */}
        <Card title="Monthly Bookings" subtitle="Completed vs. cancelled by month — cancellations sit on top so the lost portion is visible">
          <ResponsiveContainer width="100%" height={260}>
            <BarChart data={stackChart} margin={{ top:10, right:10, left:-10, bottom:0 }} barSize={44}>

              <XAxis dataKey="name" tick={{ fontSize:14, fontWeight:600, fill:C.text }} axisLine={false} tickLine={false} />

              <Tooltip content={<StackTooltip />} cursor={{ fill:"rgba(0,0,0,0.03)" }} />
              <Bar dataKey="completed" stackId="a" fill={C.green}     name="Booked & Completed" />
              <Bar dataKey="cancelled" stackId="a" fill={C.cancelled} name="Booked but Cancelled" radius={[6,6,0,0]} />
            </BarChart>
          </ResponsiveContainer>
          <Legend2Layer />
        </Card>

        {/* SCHEDULE UTILIZATION — three-layer bucket per therapist; toggle any practitioner on/off */}
        {allPractitioners.length > 0 && (
          <Card
            title="Schedule Utilization by Therapist"
            subtitle={`Completed, cancelled, and idle as % of scheduled capacity. Toggle any practitioner in the clinic on or off. Snapshot: ${SNAPSHOT_LABELS[utilSnapshotKey]}${utilSnapshotRange ? ` (${fmtDate(utilSnapshotRange.start)} – ${fmtDate(utilSnapshotRange.end)})` : ""} — closest to your selected window.`}
          >
            {/* Practitioner pill selector */}
            <div className="pill-row">

            </div>

            {utilChartData.length > 0 ? (
              <>
                <ResponsiveContainer width="100%" height={280}>
                  <BarChart data={utilChartData} margin={{ top:14, right:10, left:-15, bottom:0 }} barSize={52}>
                    <CartesianGrid strokeDasharray="3 3" stroke="#EDE9E3" vertical={false} />
                    <XAxis dataKey="name" tick={{ fontSize:15, fontWeight:600, fill:C.text }} axisLine={false} tickLine={false} />

                    <Tooltip content={<UtilTooltip />} cursor={{ fill:"rgba(0,0,0,0.03)" }} />
                    <Bar dataKey="completedPct" stackId="u" fill={C.green} name="Completed">
                      <LabelList dataKey="completedPct" position="center" formatter={v => v > 6 ? `${v}%` : ""} style={{ fill:"#fff", fontSize:13, fontWeight:700 }} />
                    </Bar>
                    <Bar dataKey="cancelledPct" stackId="u" fill={C.cancelled} name="Cancelled">
                      <LabelList dataKey="cancelledPct" position="center" formatter={v => v > 4 ? `${v}%` : ""} style={{ fill:"#fff", fontSize:12, fontWeight:700 }} />
                    </Bar>
                    <Bar dataKey="idlePct" stackId="u" fill={C.empty} name="Idle" radius={[6,6,0,0]}>
                      <LabelList dataKey="idlePct" position="top" formatter={v => v > 5 ? `${v}% idle` : ""} style={{ fill:C.muted, fontSize:13, fontWeight:700 }} />
                    </Bar>
                  </BarChart>
                </ResponsiveContainer>
                <div style={{ display:"flex", gap:16, marginTop:10, justifyContent:"center", flexWrap:"wrap" }}>
                  {[[C.green,"Completed"],[C.cancelled,"Cancelled"],[C.empty,"Idle capacity"]].map(([col,lbl]) => (
                    <div key={lbl} style={{ display:"flex", alignItems:"center", gap:6 }}>
                      <div style={{ width:10, height:10, borderRadius:2, background:col }} />
                      <span style={{ fontSize:13, color:C.muted }}>{lbl}</span>
                    </div>
                  ))}
                </div>
              </>
            ) : (
              <div style={{ fontSize:16, color:C.muted, padding:"24px 0", textAlign:"center" }}>
                Select at least one practitioner above to show their utilization.
              </div>
            )}
          </Card>
        )}

        {/* SECTION 1 — The real cost of empty hours (segment-driven, 12mo snapshot) */}
        {/* Placed after Schedule Utilization so the "why it matters" framing follows the chart. */}
        {section1 && (
          <div style={{ marginBottom:36 }}>
            <h2 style={{ fontFamily:"'Cormorant Garamond',serif", fontSize:44, fontWeight:700, color:C.text, margin:"0 0 16px 0" }}>The Real Cost of Empty Hours</h2>
            <div style={{ fontSize:16, color:C.muted, marginBottom:14 }}>
              {isAggregateSegment ? section1.segLabel : `${section1.segLabel}'s schedule`}
              {` · last 12 months (${fmtDate(section1.windowStart)} – ${fmtDate(section1.windowEnd)}) · at the standard $${section1.avgRate}/hr rate`}
              {blendedRate ? ` · realized blended rate: $${blendedRate.toFixed(0)}/hr` : ""}
            </div>

            <div style={{ display:"flex", gap:12, flexWrap:"wrap", marginBottom:16 }}>
              <SectionKPI
                value={`$${section1.lostRevPerMonth.toLocaleString()}`}
                label="Lost revenue / month"
                sub="Hours available but unfilled or cancelled — at the massage program's average $/hr"
                accent={C.accent}
              />
              <SectionKPI
                value={`${section1.emptyHoursPerMonth}h`}
                label="Empty hours / month"
                sub={isAggregateSegment ? "Idle + cancelled hours, averaged across the team over 12 months" : "Idle + cancelled hours, monthly average"}
                color={C.goldLight}
              />
              {isAggregateSegment && lowestFillRate ? (
                <SectionKPI
                  value={`${Math.round(lowestFillRate.rate * 100)}%`}
                  label={`${lowestFillRate.firstName}'s fill rate`}
                  sub={`Lowest of the 4 focus therapists — ${100 - Math.round(lowestFillRate.rate * 100)}% of her schedule sits empty every week`}
                  color={C.greenPale}
                  accent={C.green}
                />
              ) : (
                <SectionKPI
                  value={`${Math.round(section1.fillRate * 100)}%`}
                  label={`${section1.segLabel.split(" ")[0]}'s fill rate`}
                  sub={`${100 - Math.round(section1.fillRate * 100)}% of her schedule sits empty every week`}
                  color={C.greenPale}
                  accent={C.green}
                />
              )}
            </div>

            {/* Per-therapist breakdown cards — only for aggregate views. The list
                of cards depends on which aggregate view is selected:
                  • focus-massage → just the 4 focus practitioners
                  • all-massage   → every in-discipline (massage) therapist
                  • whole-clinic  → every practitioner with utilization data
                fillPct/emptyPct mirror the Schedule Utilization chart's segments
                (completed vs. cancelled+idle) so the two read consistently. */}
            {isAggregateSegment && (() => {
              const breakdownNames =
                segmentKey === "focus-massage" ? (data.practitioners?.focus || []) :
                segmentKey === "all-massage"   ? (data.practitioners?.inDiscipline || []) :
                /* whole-clinic */               Object.keys(data.practitionerUtilization || {});
              return (
              <div style={{ display:"grid", gridTemplateColumns:"repeat(auto-fit,minmax(220px,1fr))", gap:10 }}>
                {breakdownNames.map(name => {
                  const snap = data.practitionerUtilization?.[name]?.["12mo"];
                  if (!snap || !snap.shiftHours) return null;
                  const fillPct = Math.round((snap.completedHours / snap.shiftHours) * 100);
                  const emptyPct = Math.max(0, 100 - fillPct);
                  const idleRev = Math.round(((snap.idleHours + snap.cancelledHours) * avgRate) / 12);
                  const col = fillPct < 35 ? C.accent : fillPct < 55 ? C.gold : C.green;
                  const first = name.split(" ")[0];
                  return (
                    <div key={name} style={{
                      background: C.card, borderRadius: 10, padding: "14px 16px",
                      boxShadow: "0 1px 6px rgba(0,0,0,0.05)", borderLeft: `3px solid ${col}`,
                    }}>
                      <div style={{ display:"flex", justifyContent:"space-between", alignItems:"center", gap:8 }}>
                        <div style={{ fontSize:14, fontWeight:700, color:C.text }}>{first}</div>
                        <div style={{ fontFamily:"'Cormorant Garamond',serif", fontSize:22, fontWeight:700, color:col, whiteSpace:"nowrap" }}>{fillPct}% completed</div>
                      </div>
                      <div style={{ fontSize:11, color:C.muted, marginTop:4 }}>
                        <strong style={{ color:C.text }}>{emptyPct}% empty</strong> · ~${idleRev.toLocaleString()}/mo in unrealized revenue
                      </div>
                    </div>
                  );
                })}
              </div>
              );
            })()}
          </div>
        )}

        {/* REVENUE YoY */}
        <Card title="Revenue — year over year" subtitle="Monthly revenue for the selected window, with prior-year overlay">
          <ResponsiveContainer width="100%" height={240}>
            <LineChart data={revChart} margin={{ top:10, right:20, left:-5, bottom:0 }}>
              <CartesianGrid strokeDasharray="3 3" stroke="#EDE9E3" vertical={false} />
              <XAxis dataKey="name" tick={{ fontSize:14, fontWeight:600, fill:C.text }} axisLine={false} tickLine={false} />
              <YAxis tick={{ fontSize:13, fill:C.muted }} tickFormatter={fmtMoney} axisLine={false} tickLine={false} />
              <Tooltip content={<LineTooltip formatter={fmtMoney} />} />
              <Line type="monotone" dataKey="current" stroke={C.green} strokeWidth={3} dot={{ r:4 }} name="Current" />
              <Line type="monotone" dataKey="prior"   stroke={C.gold}  strokeWidth={2} dot={{ r:3 }} strokeDasharray="5 4" name="Prior year" connectNulls={false} />
            </LineChart>
          </ResponsiveContainer>
        </Card>

        {/* BOOKINGS YoY */}
        <Card title="Bookings — year over year" subtitle="Completed bookings per month (cancellations excluded), with prior-year overlay">
          <ResponsiveContainer width="100%" height={240}>
            <LineChart data={bkChart} margin={{ top:10, right:20, left:-5, bottom:0 }}>
              <CartesianGrid strokeDasharray="3 3" stroke="#EDE9E3" vertical={false} />
              <XAxis dataKey="name" tick={{ fontSize:14, fontWeight:600, fill:C.text }} axisLine={false} tickLine={false} />
              <YAxis tick={{ fontSize:13, fill:C.muted }} axisLine={false} tickLine={false} />
              <Tooltip content={<LineTooltip formatter={fmtNum} />} />
              <Line type="monotone" dataKey="current" stroke={C.greenLight} strokeWidth={3} dot={{ r:4 }} name="Current" />
              <Line type="monotone" dataKey="prior"   stroke={C.gold}       strokeWidth={2} dot={{ r:3 }} strokeDasharray="5 4" name="Prior year" connectNulls={false} />
            </LineChart>
          </ResponsiveContainer>

        {/* CANCELLATIONS YoY */}
        <Card title="Cancellations — year over year" subtitle="Cancelled bookings per month, with prior-year overlay">

              <CartesianGrid strokeDasharray="3 3" stroke="#EDE9E3" vertical={false} />

              <Tooltip content={<LineTooltip formatter={fmtNum} />} />
              <Line type="monotone" dataKey="current" stroke={C.accent} strokeWidth={3} dot={{ r:4 }} name="Current" />
              <Line type="monotone" dataKey="prior"   stroke={C.gold}   strokeWidth={2} dot={{ r:3 }} strokeDasharray="5 4" name="Prior year" connectNulls={false} />

          <div style={{ overflowX:"auto" }}>

                <tr style={{ borderBottom:`2px solid ${C.greenPale}`, color:C.muted, fontWeight:700, textTransform:"uppercase", fontSize:12, letterSpacing:"0.06em" }}>
                  <th>Month</th>
                  <th style={{ textAlign:"right" }}>Revenue</th>
                  <th style={{ textAlign:"right" }}>YoY</th>

                  <th style={{ textAlign:"right" }}>YoY</th>
                  <th style={{ textAlign:"right" }}>Cancelled</th>
                  <th style={{ textAlign:"right" }}>Rate</th>
                </tr>
              </thead>
              <tbody>
                {windowMonths.map((m, i) => {
                  const cur = windowRows[i] || {};
                  const prior = priorRows[i] || null;
                  const revDelta = pct(cur.revenue,   prior?.revenue);
                  const bkDelta  = pct(cur.completed, prior?.completed);
                  const rate = cur.booked ? (cur.cancelled / cur.booked) * 100 : null;
                  return (
                    <tr key={m} style={{ borderBottom:"1px solid #EDE9E3" }}>
                      <td style={{ fontWeight:600, color:C.text }}>{monthLabel(m)}</td>
                      <td style={{ textAlign:"right" }}>{fmtMoney(cur.revenue)}</td>
                      <td style={{ textAlign:"right", color: revDelta == null ? C.muted : (revDelta >= 0 ? C.green : C.accent), fontWeight:600 }}>{revDelta == null ? "—" : `${revDelta >= 0 ? "+" : ""}${revDelta.toFixed(1)}%`}</td>
                      <td style={{ textAlign:"right" }}>{fmtNum(cur.completed)}</td>
                      <td style={{ textAlign:"right", color: bkDelta == null ? C.muted : (bkDelta >= 0 ? C.green : C.accent), fontWeight:600 }}>{bkDelta == null ? "—" : `${bkDelta >= 0 ? "+" : ""}${bkDelta.toFixed(1)}%`}</td>
                      <td style={{ textAlign:"right" }}>{fmtNum(cur.cancelled)}</td>
                      <td style={{ textAlign:"right", color:C.muted }}>{rate == null ? "—" : `${rate.toFixed(1)}%`}</td>
                    </tr>
                  );
                })}
              </tbody>
            </table>
          </div>
        </Card>
        </>
        )}

        </div>
      </main>
    </div>
  );
}

// --- Helpers ---

// Filter daily rows to [dateStart, dateEnd] inclusive; also returns prior-year equivalents
// (both endpoints shifted back 1 year) and monthly roll-ups for charts/table.
function buildRange(daily, dateStart, dateEnd) {
  const empty = { windowMonths:[], priorMonths:[], windowRows:[], priorRows:[], currentDaily:[], priorDaily:[] };
  if (!daily || !daily.length || !dateStart || !dateEnd) return empty;

  const inRange = (d, s, e) => d >= s && d <= e;
  const currentDaily = daily.filter(d => inRange(d.date, dateStart, dateEnd));

  const priorStart = shiftDateYear(dateStart, -1);
  const priorEnd   = shiftDateYear(dateEnd,   -1);
  const priorDaily = daily.filter(d => inRange(d.date, priorStart, priorEnd));

  const aggToMonths = (rows) => {
    const byMonth = {};
    for (const r of rows) {
      const month = r.date.slice(0, 7);
      byMonth[month] ??= { month, revenue: 0, completed: 0, cancelled: 0, booked: 0 };
      byMonth[month].revenue   += r.revenue;
      byMonth[month].completed += r.completed;
      byMonth[month].cancelled += r.cancelled;
      byMonth[month].booked    += r.booked;
    }
    for (const m of Object.keys(byMonth)) {
      byMonth[m].revenue = Math.round(byMonth[m].revenue * 100) / 100;
    }
    return byMonth;
  };

  const currentByMonth = aggToMonths(currentDaily);
  const priorByMonth   = aggToMonths(priorDaily);

  const windowMonths = monthsBetween(dateStart.slice(0,7), dateEnd.slice(0,7));
  const priorMonths  = windowMonths.map(m => shiftYear(m, -1));

  const windowRows = windowMonths.map(m => currentByMonth[m] || { month: m, revenue: 0, completed: 0, cancelled: 0, booked: 0 });
  const hasPrior = Object.keys(priorByMonth).length > 0;
  const priorRows  = hasPrior ? priorMonths.map(m => priorByMonth[m] || null) : [];

  return { windowMonths, priorMonths, windowRows, priorRows, currentDaily, priorDaily };
}

function shiftDateYear(dateStr, delta) {
  const [y, m, d] = dateStr.split("-").map(Number);
  return `${y + delta}-${String(m).padStart(2,"0")}-${String(d).padStart(2,"0")}`;
}

function monthsBetween(startMonth, endMonth) {
  const [sy, sm] = startMonth.split("-").map(Number);
  const [ey, em] = endMonth.split("-").map(Number);
  const out = [];
  let y = sy, m = sm;
  while (y < ey || (y === ey && m <= em)) {
    out.push(`${y}-${String(m).padStart(2,"0")}`);
    m += 1; if (m > 12) { m = 1; y += 1; }
  }
  return out;
}

// Format a YYYY-MM-DD date for display in the UI
function fmtDate(d) {
  if (!d) return "—";
  const [y, m, day] = d.split("-").map(Number);
  return `${MONTH_LABELS[m-1]} ${day}, ${y}`;
}

function addDays(dateStr, n) {
  const d = new Date(dateStr + "T00:00:00Z");
  d.setUTCDate(d.getUTCDate() + n);
  return d.toISOString().slice(0, 10);
}
function daysBetweenInclusive(startStr, endStr) {
  const a = new Date(startStr + "T00:00:00Z").getTime();
  const b = new Date(endStr   + "T00:00:00Z").getTime();
  return Math.round((b - a) / 86400000) + 1;
}
function firstOfMonth(dateStr) { return dateStr.slice(0, 7) + "-01"; }
function lastOfMonth(dateStr) {
  const [y, m] = dateStr.split("-").map(Number);
  const last = new Date(Date.UTC(y, m, 0)).getUTCDate();
  return `${y}-${String(m).padStart(2,"0")}-${String(last).padStart(2,"0")}`;
}
function shiftMonthFirst(dateStr, delta) {
  const [y, m] = dateStr.split("-").map(Number);
  const total = (y * 12 + (m - 1)) + delta;
  const ny = Math.floor(total / 12);
  const nm = (total % 12) + 1;
  return `${ny}-${String(nm).padStart(2,"0")}-01`;
}
